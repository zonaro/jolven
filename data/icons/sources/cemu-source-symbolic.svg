<!--
  Cemu: marca oficial do Cemu (ícone do Flatpak info.cemu.Cemu), letra "C"
  grossa aberta para a direita dentro do quadrado de cantos arredondados.
  Em 16px sobra a "C" com a abertura para a direita e a haste grossa; o
  arredondamento e a borda escura somem. Fonte: ícone oficial do Cemu.
  Somente geometria preenchida: o GTK recolore pelo `fill`.
-->

<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#000000">
  <path d="M16 0 12 0 12 4 2 4 2 12 12 12 12 16 16 16 Z"/>
</svg>
