name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: release-${{ github.sha }}
jobs:
  python-core:
    name: Python pure-stdlib contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate session helper shell syntax
        run: bash -n session/jolven-game-mode-setup.in session/jolven-session.in
      - name: Test session helper contracts
        run: python -m unittest tests.test_session_helper -v
      - name: Test Linux paths, authentication, ROM transfer and RetroArch diagnostics
        run: python -m unittest tests.test_versioning tests.test_linux_desktop_contract tests.test_platform_paths tests.test_platform_authentication tests.test_retroarch_diagnostics tests.test_nearby_manifest tests.test_retroarch_nci tests.test_nearby_sender tests.test_nearby_receiver -v

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flatpak Builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.5
        with:
          bundle: io.github.zonaro.Jolven.Devel.flatpak
          manifest-path: build-aux/flatpak/io.github.zonaro.Jolven.Devel.json
