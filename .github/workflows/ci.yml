name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: release-${{ github.sha }}
jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flatpak Builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.5
        with:
          bundle: io.github.zonaro.Jolven.Devel.flatpak
          manifest-path: build-aux/flatpak/io.github.zonaro.Jolven.Devel.json

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      # O blueprint-compiler le os .blp na codificacao do locale; sem isto, cp1252.
      PYTHONUTF8: "1"
    steps:
      # Mantem LF no checkout: o Windows costuma converter para CRLF.
      - name: Desligar a conversao de fim de linha
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # O meson e o ninja precisam vir do MinGW: o meson do MSYS2 roda com o
          # python do MSYS2 e recusa o ambiente MinGW.
          install: >-
            git
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-requests
            mingw-w64-ucrt-x86_64-python-yaml
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-ca-certificates
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja

      # Fase 0: prova so a compilacao. O teste de abrir a janela entra quando o
      # aplicativo conseguir iniciar no Windows.
      - name: Compile
        shell: msys2 {0}
        run: |
          meson setup build
          meson compile -C build
