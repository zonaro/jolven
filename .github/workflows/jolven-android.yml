name: Jolven Android frontend

on:
  push:
    paths:
      - 'android/jolven_flutter/**'
      - '.github/workflows/jolven-android.yml'
  pull_request:
    paths:
      - 'android/jolven_flutter/**'
      - '.github/workflows/jolven-android.yml'
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze, tests, debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffold
        working-directory: android/jolven_flutter
        run: flutter create --org com.redclaw --project-name jolven_flutter --platforms android .
      - name: Resolve dependencies
        working-directory: android/jolven_flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: android/jolven_flutter
        run: flutter analyze
      - name: Unit tests
        working-directory: android/jolven_flutter
        run: flutter test
      - name: Kotlin ROM patcher unit tests
        working-directory: android/jolven_flutter/android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Print Kotlin test report on failure
        if: failure()
        working-directory: android/jolven_flutter/android
        run: find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -type f -exec cat {} \; || true
      - name: Build debug APK
        working-directory: android/jolven_flutter
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jolven-android-debug
          path: android/jolven_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
