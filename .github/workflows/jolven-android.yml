name: Jolven Android frontend

on:
  push:
    paths:
      - 'android/jolven_flutter/**'
      - '.github/workflows/jolven-android.yml'
  pull_request:
    paths:
      - 'android/jolven_flutter/**'
      - '.github/workflows/jolven-android.yml'
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze, tests, debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffold
        working-directory: android/jolven_flutter
        run: flutter create --org com.redclaw --project-name jolven_flutter --platforms android .
      - name: Configure generated Android build (API 26 + JUnit)
        working-directory: android/jolven_flutter/android
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' app/build.gradle.kts
          grep -q 'minSdk = 26' app/build.gradle.kts
          echo 'dependencies { testImplementation("junit:junit:4.13.2") }' >> app/build.gradle.kts
      - name: Resolve dependencies
        working-directory: android/jolven_flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: android/jolven_flutter
        run: flutter analyze
      - name: Unit tests
        working-directory: android/jolven_flutter
        run: flutter test
      - name: Kotlin ROM patcher unit tests
        working-directory: android/jolven_flutter/android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Print Kotlin test report on failure
        if: failure()
        working-directory: android/jolven_flutter/android
        run: if test -d ../build/app/test-results/testDebugUnitTest; then find ../build/app/test-results/testDebugUnitTest -name 'TEST-*.xml' -type f -exec cat {} \; ; fi
      - name: Build debug APK
        working-directory: android/jolven_flutter
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jolven-android-debug
          path: android/jolven_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  android-smoke:
    name: Android emulator native bridge smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffold
        working-directory: android/jolven_flutter
        run: flutter create --org com.redclaw --project-name jolven_flutter --platforms android .
      - name: Enforce Android API 26
        working-directory: android/jolven_flutter/android
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' app/build.gradle.kts
      - name: Resolve dependencies
        working-directory: android/jolven_flutter
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            cd android/jolven_flutter
            flutter devices
            flutter test integration_test/native_bridge_test.dart -d emulator-5554 --reporter expanded
