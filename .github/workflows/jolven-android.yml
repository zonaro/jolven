name: Jolven Android frontend

on:
  push:
    paths:
      - 'android/jolven_flutter/**'
      - '.github/workflows/jolven-android.yml'
  pull_request:
    paths:
      - 'android/jolven_flutter/**'
      - '.github/workflows/jolven-android.yml'
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze, tests, debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffold
        working-directory: android/jolven_flutter
        run: flutter create --org com.redclaw --project-name jolven_flutter --platforms android .
      - name: Resolve dependencies
        working-directory: android/jolven_flutter
        run: flutter pub get
      - name: Static analysis
        working-directory: android/jolven_flutter
        run: flutter analyze
      - name: Unit tests
        working-directory: android/jolven_flutter
        run: flutter test
      - name: Build debug APK
        working-directory: android/jolven_flutter
        run: flutter build apk --debug
